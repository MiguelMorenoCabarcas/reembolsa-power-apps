NuevaSolicitudScreen As screen:
    Fill: =ColorFondo
    OnVisible: |-
        =Clear(colGastosNuevo);
        UpdateContext({ctxMsg: "", ctxGuardando: false});
        If(
            gblEditId > 0,
            Set(gblEdit, LookUp(SolicitudesLST, ID = gblEditId));
            ClearCollect(
                colGastosNuevo,
                ForAll(
                    Filter(GastosLST, Title = gblEditNo),
                    {
                        Cat: CategoriaNombre,
                        CatId: Categoria.Id,
                        Prov: Proveedor,
                        Desc: Descripcion,
                        Recibo: NumeroRecibo,
                        Fecha: FechaGasto,
                        Monto: Monto
                    }
                )
            ),
            Set(gblEdit, Blank())
        );
        Reset(nuevaCentro);
        Reset(nuevaMotivo);
        Reset(nuevaFechaGasto);
        Reset(nuevaProveedor);
        Reset(nuevaDescripcion);
        Reset(nuevaRecibo);
        Reset(nuevaMonto)

