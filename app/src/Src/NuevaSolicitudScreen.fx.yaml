    nuevaBorrador As button:
        Align: =Align.Center
        BorderColor: =ColorPrimario
        BorderThickness: =1
        Color: =ColorPrimario
        DisabledColor: =ColorTextoSuave
        DisabledFill: =ColorBorde
        DisplayMode: =If(ctxGuardando, DisplayMode.Disabled, DisplayMode.Edit)
        Fill: =Color.White
        Font: =Font.'Open Sans'
        FontWeight: =FontWeight.Semibold
        Height: =44
        HoverColor: =ColorPrimario
        HoverFill: =ColorPrimarioClaro
        OnSelect: |-
            =UpdateContext({ctxMsg: ""});
            If(
                IsBlank(nuevaCentro.Selected) || CountRows(colGastosNuevo) = 0,
                UpdateContext({ctxMsg: "Selecciona el centro de costo y agrega al menos un gasto."}),
                UpdateContext({ctxGuardando: true, ctxFallo: false});
                Set(gblTotal, Sum(colGastosNuevo, Monto));
                Set(gblEstadoNuevo, If(gblEditId > 0, gblEdit.Estado.Value, "Borrador"));
                Set(gblNivelNuevo, Switch(gblEstadoNuevo, "PendienteJefe", 1, "PendienteFinanzas", 2, 0));
                Set(gblAprobNuevo, If(gblEstadoNuevo = "PendienteJefe", Lower(gblUser.JefeEmail), ""));
                If(
                    gblEditId = 0,
                    Set(gblTipoConsec, "REM-" & Text(Year(Today()), "0"));
                    Refresh(ConsecutivoLST);
                    Set(gblContador, LookUp(ConsecutivoLST, Tipo = gblTipoConsec));
                    Set(gblN, Coalesce(Value(gblContador.Valor), 0) + 1);
                    Set(
                        gblReservaOK,
                        !IsBlank(
                            IfError(
                                If(
                                    IsBlank(gblContador),
                                    Patch(ConsecutivoLST, Defaults(ConsecutivoLST), {Title: gblTipoConsec, Tipo: gblTipoConsec, Valor: Text(gblN)}),
                                    Patch(ConsecutivoLST, gblContador, {Valor: Text(gblN)})
                                ),
                                Blank()
                            )
                        )
                    );
                    If(
                        !gblReservaOK,
                        Notify("Otra persona está creando una solicitud en este momento. No se creó nada. Intenta de nuevo.", NotificationType.Warning);
                        UpdateContext({ctxFallo: true}),
                        Set(gblNoGuardar, gblTipoConsec & "-" & Text(gblN, "00000"));
                        Set(
                            gblHdr,
                            IfError(
                                Patch(
                                    SolicitudesLST,
                                    Defaults(SolicitudesLST),
                                    {
                                        Title: gblNoGuardar,
                                        Solicitante: UsuarioActual,
                                        SolicitanteEmail: gblUserEmail,
                                        CentroCosto: {Id: nuevaCentro.Selected.Id, Value: nuevaCentro.Selected.Cod},
                                        CentroCostoCod: nuevaCentro.Selected.Cod,
                                        Motivo: Trim(nuevaMotivo.Text),
                                        FechaSolicitud: Today(),
                                        MontoTotal: gblTotal,
                                        Estado: {Value: gblEstadoNuevo},
                                        NivelActual: gblNivelNuevo,
                                        AprobadorEmail: gblAprobNuevo,
                                        RequiereFinanzas: gblTotal >= gblUmbral,
                                        FechaEnvio: Blank()
                                    }
                                ),
                                Blank()
                            )
                        );
                        If(
                            IsBlank(gblHdr),
                            Notify("No se pudo crear la solicitud. Intenta de nuevo.", NotificationType.Error);
                            UpdateContext({ctxFallo: true})
                        )
                    ),
                    Set(gblNoGuardar, gblEditNo);
                    Set(gblHdr, gblEdit)
                );
                If(
                    !ctxFallo,
                    ClearCollect(colOld, Filter(GastosLST, Title = gblNoGuardar));
                    Clear(colCreados);
                    IfError(
                        ForAll(
                            colGastosNuevo As G,
                            Collect(
                                colCreados,
                                Patch(
                                    GastosLST,
                                    Defaults(GastosLST),
                                    {
                                        Title: gblNoGuardar,
                                        Solicitud: {Id: gblHdr.ID, Value: gblNoGuardar},
                                        Categoria: {Id: G.CatId, Value: G.Cat},
                                        CategoriaNombre: G.Cat,
                                        FechaGasto: G.Fecha,
                                        Proveedor: G.Prov,
                                        Descripcion: G.Desc,
                                        Monto: G.Monto,
                                        NumeroRecibo: G.Recibo
                                    }
                                )
                            )
                        );
                        true,
                        UpdateContext({ctxFallo: true})
                    );
                    If(
                        !ctxFallo && gblEditId > 0,
                        Set(
                            gblHdr2,
                            IfError(
                                Patch(
                                    SolicitudesLST,
                                    gblEdit,
                                    {
                                        CentroCosto: {Id: nuevaCentro.Selected.Id, Value: nuevaCentro.Selected.Cod},
                                        CentroCostoCod: nuevaCentro.Selected.Cod,
                                        Motivo: Trim(nuevaMotivo.Text),
                                        MontoTotal: gblTotal,
                                        Estado: {Value: gblEstadoNuevo},
                                        NivelActual: gblNivelNuevo,
                                        AprobadorEmail: gblAprobNuevo,
                                        RequiereFinanzas: gblTotal >= gblUmbral,
                                        FechaEnvio: gblEdit.FechaEnvio
                                    }
                                ),
                                Blank()
                            )
                        );
                        If(IsBlank(gblHdr2), UpdateContext({ctxFallo: true}))
                    );
                    If(
                        ctxFallo,
                        ForAll(colCreados As C, Remove(GastosLST, C));
                        If(gblEditId = 0, Remove(SolicitudesLST, gblHdr));
                        Notify("No se pudo guardar la solicitud. No se aplicó ningún cambio. Intenta de nuevo.", NotificationType.Error),
                        ForAll(colOld As O, Remove(GastosLST, O));
                        If(gblEditId = 0, IfError(
                            Patch(
                                BitacoraLST,
                                Defaults(BitacoraLST),
                                {
                                    Title: gblNoGuardar,
                                    Solicitud: {Id: gblHdr.ID, Value: gblNoGuardar},
                                    Accion: {Value: "Creada"},
                                    Nivel: 0,
                                    Actor: UsuarioActual,
                                    ActorEmail: gblUserEmail,
                                    EstadoAnterior: "",
                                    EstadoNuevo: "Borrador",
                                    Comentario: "",
                                    FechaAccion: Now()
                                }
                            );
                            true,
                            Notify("El cambio se guardó, pero no se pudo escribir en la bitácora.", NotificationType.Warning)
                        ));
                        Set(gblSelId, gblHdr.ID);
                        UpdateContext({ctxGuardando: false});
                        Notify("Borrador guardado.", NotificationType.Success);
                        Navigate(DetalleSolicitudScreen, ScreenTransition.None)
                    )
                );
                If(ctxFallo, UpdateContext({ctxGuardando: false}))
            )
        PressedColor: =ColorPrimario
        PressedFill: =ColorPrimarioClaro
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
