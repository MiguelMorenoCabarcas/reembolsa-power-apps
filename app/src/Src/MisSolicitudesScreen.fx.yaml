                ctxTodas && gblEsFinanzas,
                If(
                    misEstado.Selected.Raw = "Todos",
                    Sort(Filter(SolicitudesLST, StartsWith(Title, misBuscar.Text)), ID, SortOrder.Descending),
                    Sort(Filter(SolicitudesLST, StartsWith(Title, misBuscar.Text), Estado.Value = misEstado.Selected.Raw), ID, SortOrder.Descending)
