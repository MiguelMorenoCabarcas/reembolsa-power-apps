        Align: =Align.Center
        BorderColor: =ColorExito
        BorderThickness: =0
        Color: =Color.White
        DisabledColor: =ColorTextoSuave
        DisabledFill: =ColorBorde
        Fill: =ColorExito
        Font: =Font.'Open Sans'
        FontWeight: =FontWeight.Semibold
        Height: =44
        HoverColor: =Color.White
        HoverFill: =ColorExito
        OnSelect: |-
            =Refresh(SolicitudesLST);
            Set(gblSel, LookUp(SolicitudesLST, ID = gblSelId));
            If(
                !((gblSel.Estado.Value = "PendienteJefe" && !(Lower(gblSel.SolicitanteEmail) = gblUserEmail) && (Lower(gblSel.AprobadorEmail) = gblUserEmail || gblRol = "Administrador")) || (gblSel.Estado.Value = "PendienteFinanzas" && !(Lower(gblSel.SolicitanteEmail) = gblUserEmail) && gblEsFinanzas)),
                Notify("La solicitud cambió de estado. Se actualizó la pantalla.", NotificationType.Warning),
                Set(gblEstadoAnt, gblSel.Estado.Value);
                Set(
                    gblRes,
                    IfError(
                        Patch(
                            SolicitudesLST,
                            gblSel,
                            {
                                Estado: {Value: If(gblSel.Estado.Value = "PendienteJefe", If(gblSel.MontoTotal >= gblUmbral, "PendienteFinanzas", "Aprobada"), "Aprobada")},
                                NivelActual: If(gblSel.Estado.Value = "PendienteJefe" && gblSel.MontoTotal >= gblUmbral, 2, 0),
                                AprobadorEmail: ""
                            }
                        ),
                        Blank()
                    )
                );
                If(
                    IsBlank(gblRes),
                    Notify("No se pudo guardar el cambio. Intenta de nuevo.", NotificationType.Error),
                    IfError(
                        Patch(
                            BitacoraLST,
                            Defaults(BitacoraLST),
                            {
                                Title: gblSel.Title,
                                Solicitud: {Id: gblSel.ID, Value: gblSel.Title},
                                Accion: {Value: If(gblEstadoAnt = "PendienteJefe", "AprobadaJefe", "AprobadaFinanzas")},
                                Nivel: gblSel.NivelActual,
                                Actor: UsuarioActual,
                                ActorEmail: gblUserEmail,
                                EstadoAnterior: gblEstadoAnt,
                                EstadoNuevo: If(gblSel.Estado.Value = "PendienteJefe", If(gblSel.MontoTotal >= gblUmbral, "PendienteFinanzas", "Aprobada"), "Aprobada"),
                                Comentario: Trim(detComentario.Text),
                                FechaAccion: Now()
                            }
                        );
                        true,
                        Notify("El cambio se guardó, pero no se pudo escribir en la bitácora.", NotificationType.Warning)
                    );
                    Set(gblSel, gblRes);
                    Reset(detComentario);
                    Reset(detReferencia);
                    Notify("Solicitud aprobada.", NotificationType.Success)
                )
            )
