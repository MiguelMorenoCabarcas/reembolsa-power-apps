    detEnviar As button:
        Align: =Align.Center
        BorderColor: =ColorPrimario
        BorderThickness: =0
        Color: =Color.White
        DisabledColor: =ColorTextoSuave
        DisabledFill: =ColorBorde
        Fill: =ColorPrimario
        Font: =Font.'Open Sans'
        FontWeight: =FontWeight.Semibold
        Height: =44
        HoverColor: =Color.White
        HoverFill: =ColorPrimario
        OnSelect: |-
            =Refresh(SolicitudesLST);
            Set(gblSel, LookUp(SolicitudesLST, ID = gblSelId));
            If(
                !(Lower(gblSel.SolicitanteEmail) = gblUserEmail && gblSel.Estado.Value in ["Borrador", "Devuelta"]),
                Notify("La solicitud cambió de estado. Se actualizó la pantalla.", NotificationType.Warning),
                Set(gblEstadoAnt, gblSel.Estado.Value);
                Set(
                    gblRes,
                    IfError(
                        Patch(
                            SolicitudesLST,
                            gblSel,
                            {
                                Estado: {Value: If(IsBlank(gblUser.JefeEmail) || Lower(gblUser.JefeEmail) = gblUserEmail, "PendienteFinanzas", "PendienteJefe")},
                                NivelActual: If(IsBlank(gblUser.JefeEmail) || Lower(gblUser.JefeEmail) = gblUserEmail, 2, 1),
                                AprobadorEmail: If(IsBlank(gblUser.JefeEmail) || Lower(gblUser.JefeEmail) = gblUserEmail, "", Lower(gblUser.JefeEmail)),
                                RequiereFinanzas: gblSel.MontoTotal >= gblUmbral,
                                FechaEnvio: Now()
                            }
                        ),
                        Blank()
                    )
                );
                If(
                    IsBlank(gblRes),
                    Notify("No se pudo guardar el cambio. Intenta de nuevo.", NotificationType.Error),
                    IfError(
                        Patch(
                            BitacoraLST,
                            Defaults(BitacoraLST),
                            {
                                Title: gblSel.Title,
                                Solicitud: {Id: gblSel.ID, Value: gblSel.Title},
                                Accion: {Value: "Enviada"},
                                Nivel: 1,
                                Actor: UsuarioActual,
                                ActorEmail: gblUserEmail,
                                EstadoAnterior: gblEstadoAnt,
                                EstadoNuevo: If(IsBlank(gblUser.JefeEmail) || Lower(gblUser.JefeEmail) = gblUserEmail, "PendienteFinanzas", "PendienteJefe"),
                                Comentario: Trim(detComentario.Text),
                                FechaAccion: Now()
                            }
                        );
                        true,
                        Notify("El cambio se guardó, pero no se pudo escribir en la bitácora.", NotificationType.Warning)
                    );
                    Set(gblSel, gblRes);
                    Reset(detComentario);
                    Reset(detReferencia);
                    Notify("Solicitud enviada a aprobación.", NotificationType.Success)
                )
            )
        PressedColor: =Color.White
        PressedFill: =ColorPrimario
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =12
        Text: =If(gblSel.Estado.Value = "Devuelta", "Reenviar a aprobación", "Enviar a aprobación")
        Visible: =Lower(gblSel.SolicitanteEmail) = gblUserEmail && gblSel.Estado.Value in ["Borrador", "Devuelta"]
